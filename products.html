<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <!-- Instant Theme Loader to Prevent Flash -->
    <script>
        const savedTheme = localStorage.getItem('site-theme') || 'gray';
        const savedCustomBg = localStorage.getItem('custom-bg');
        const savedCustomText = localStorage.getItem('custom-text');
        const html = document.documentElement;

        if (savedTheme === 'random' && savedCustomBg) {
            html.setAttribute('data-theme', 'random');
            html.style.setProperty('--bg-color', savedCustomBg);
            html.style.setProperty('--sidebar-bg', savedCustomBg);
            html.style.setProperty('--text-color', savedCustomText);
            html.style.setProperty('--link-color', savedCustomText);
        } else {
            html.setAttribute('data-theme', savedTheme);
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <a href="index.html">
                <img src="images/rattlesnake.jpeg" alt="Rattlesnake drawing">
            </a>        
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="projects.html" class="nav-link">Projects</a></li>
            
            <li>
                <a href="products.html" class="nav-link active">Products</a>
                <!-- Live Search & Filters Added -->
                <div class="sub-nav">
                    <input type="text" id="live-search" class="search-box" placeholder="Live Search...">
                    <label class="filter-label"><input type="checkbox" class="cat-filter" value="Scythe"> Scythe</label>
                    <label class="filter-label"><input type="checkbox" class="cat-filter" value="Hardware"> Hardware</label>
                </div>
            </li>
            
            <li><a href="writing.html" class="nav-link">Writing</a></li>
            <li><a href="photos.html" class="nav-link">Photos</a></li>
            <li><a href="reference.html" class="nav-link">For Reference</a></li>
        </ul>
        <div class="theme-selector">
            <button class="theme-btn" id="theme-black"></button>
            <button class="theme-btn" id="theme-white"></button>
            <button class="theme-btn" id="theme-gray"></button>
            <button class="theme-btn" id="theme-random"></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="grid" id="content-grid">
            
            <a href="products/scytheplate.html" class="tile-wrapper filterable-item" data-title="Scythe Plate S1" data-tags="scythe, hardware">
                <div class="tile">
                    <img src="images/scytheplatetitle.jpeg" alt="Scythe Plate">
                </div>
                <div class="tile-label">
                    <span>Scythe Plate</span>
                    <span class="product-thumb-price">$20.00</span>
                </div>
            </a>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
