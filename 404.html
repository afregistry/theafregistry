<!-- Github pages automatically looks for a file named 404.html when a user tries to visit a link that doesn't exist, so this works. May not work when using a different hosting -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <!-- Instant Theme Loader to Prevent Flash -->
    <script>
        const savedTheme = localStorage.getItem('site-theme') || 'gray';
        const savedCustomBg = localStorage.getItem('custom-bg');
        const savedCustomText = localStorage.getItem('custom-text');
        const html = document.documentElement;

        if (savedTheme === 'random' && savedCustomBg) {
            html.setAttribute('data-theme', 'random');
            html.style.setProperty('--bg-color', savedCustomBg);
            html.style.setProperty('--sidebar-bg', savedCustomBg);
            html.style.setProperty('--text-color', savedCustomText);
            html.style.setProperty('--link-color', savedCustomText);
        } else {
            html.setAttribute('data-theme', savedTheme);
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <a href="index.html">
                <img src="images/rattlesnake.jpeg" alt="Rattlesnake drawing">
            </a>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="projects.html" class="nav-link">Projects</a></li>
            <li><a href="products.html" class="nav-link">Products</a></li>
            <li><a href="writing.html" class="nav-link">Writing</a></li>
            <li><a href="photos.html" class="nav-link">Photos</a></li>
            <li><a href="reference.html" class="nav-link">For Reference</a></li>
        </ul>
        <div class="theme-selector">
            <button class="theme-btn" id="theme-black"></button>
            <button class="theme-btn" id="theme-white"></button>
            <button class="theme-btn" id="theme-gray"></button>
            <button class="theme-btn" id="theme-random"></button>
        </div>
    </aside>

    <main class="main-content">
        <!-- Reusing the single-view layout center-offset trick so it perfectly aligns to your screen -->
        <div class="single-view">
            <h1 class="error-title">404</h1>
            <!-- Utilizing the sharp-corner layout for the larger image -->
            <img src="images/rattlesnake.jpeg" alt="Rattlesnake drawing" class="error-img">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
