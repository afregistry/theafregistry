<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <!-- Instant Theme Loader to Prevent Flash -->
    <script>
        const savedTheme = localStorage.getItem('site-theme') || 'gray';
        const savedCustomBg = localStorage.getItem('custom-bg');
        const savedCustomText = localStorage.getItem('custom-text');
        const html = document.documentElement;

        if (savedTheme === 'random' && savedCustomBg) {
            html.setAttribute('data-theme', 'random');
            html.style.setProperty('--bg-color', savedCustomBg);
            html.style.setProperty('--sidebar-bg', savedCustomBg);
            html.style.setProperty('--text-color', savedCustomText);
            html.style.setProperty('--link-color', savedCustomText);
        } else {
            html.setAttribute('data-theme', savedTheme);
        }
    </script>
    
    <!-- Safely defaults to local paths for testing on your hard drive -->
    <link id="dynamic-css" rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <a id="dynamic-home" href="index.html">
                <img id="dynamic-logo" src="images/rattlesnake.jpeg" alt="Rattlesnake drawing">
            </a>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="projects.html" class="nav-link">Projects</a></li>
            <li><a href="products.html" class="nav-link">Products</a></li>
            <li><a href="writing.html" class="nav-link">Writing</a></li>
            <li><a href="photos.html" class="nav-link">Photos</a></li>
            <li><a href="reference.html" class="nav-link">For Reference</a></li>
        </ul>
        <div class="theme-selector">
            <button class="theme-btn" id="theme-black"></button>
            <button class="theme-btn" id="theme-white"></button>
            <button class="theme-btn" id="theme-gray"></button>
            <button class="theme-btn" id="theme-random"></button>
        </div>
    </aside>

    <main class="main-content">
        <div class="single-view">
            <h1 class="error-title">404</h1>
            <img id="dynamic-error" src="images/rattlesnake.jpeg" alt="Rattlesnake drawing" class="error-img">
        </div>
    </main>

    <script id="dynamic-js" src="script.js"></script>

    <!-- THE ENVIRONMENT FIX: Runs instantly before the page paints -->
    <script>
        /* If loaded on a live server (GitHub Pages) instead of your local drive, 
           this rewrites assets to pull from the root so they work in any subfolder! */
        if (window.location.protocol !== 'file:') {
            document.getElementById('dynamic-css').href = '/styles.css';
            document.getElementById('dynamic-js').src = '/script.js';
            document.getElementById('dynamic-logo').src = '/images/rattlesnake.jpeg';
            document.getElementById('dynamic-error').src = '/images/rattlesnake.jpeg';
            
            document.querySelectorAll('.nav-link').forEach(link => {
                const page = link.getAttribute('href');
                link.setAttribute('href', '/' + page);
            });
            document.getElementById('dynamic-home').setAttribute('href', '/index.html');
        }
    </script>
</body>
</html>
