<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>afregistry</title>
    <!-- the meta description. Technically need this in all folders. recommended standard limit of 155 characters -->
    <meta name="description" content="Website pertaining to Ali Fakhari, featuring handmade goods, writing, photography, and reference materials.">
    <link rel="icon" type="image/jpeg" href="images/rattlesnake.jpeg">
    <!-- <link rel="icon" type="image/jpeg" href="../images/rattlesnake.jpeg"> for subfolders -->
     
    <!-- Instant Theme Loader to Prevent Flash -->
    <script>
        const savedTheme = localStorage.getItem('site-theme') || 'gray';
        const savedCustomBg = localStorage.getItem('custom-bg');
        const savedCustomText = localStorage.getItem('custom-text');
        const html = document.documentElement;

        if (savedTheme === 'random' && savedCustomBg) {
            html.setAttribute('data-theme', 'random');
            html.style.setProperty('--bg-color', savedCustomBg);
            html.style.setProperty('--sidebar-bg', savedCustomBg);
            html.style.setProperty('--text-color', savedCustomText);
            html.style.setProperty('--link-color', savedCustomText);
        } else {
            html.setAttribute('data-theme', savedTheme);
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <a href="index.html">
                <img src="images/rattlesnake.jpeg" alt="Rattlesnake drawing">
            </a>        
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link active">Home</a></li>
            <li><a href="about.html" class="nav-link">About</a></li>
            <li><a href="projects.html" class="nav-link">Projects</a></li>
            <li><a href="products.html" class="nav-link">Products</a></li>
            <li><a href="writing.html" class="nav-link">Writing</a></li>
            <li><a href="photos.html" class="nav-link">Photos</a></li>
            <li><a href="reference.html" class="nav-link">For Reference</a></li>
        </ul>
        <div class="theme-selector">
            <button class="theme-btn" id="theme-black" title="OLED Black"></button>
            <button class="theme-btn" id="theme-white" title="E-Ink White"></button>
            <button class="theme-btn" id="theme-gray" title="Grayscale Default"></button>
            <button class="theme-btn" id="theme-random" title="Random Color"></button>
        </div>
    </aside>

    <main class="main-content">
        <p class="hero-text">Website pertaining to <a href="about.html">Ali Fakhari</a></p>
            
        <p class="disclaimer-text">
                Many components of this website are currently under development, with placeholders that do not accurately reflect Ali Fakhari's opinions.
        </p>    </main>

    <script src="script.js"></script>
</body>
</html>
